# Change `app` to a name that is free in your Fly organization.
# The domain in NEXT_PUBLIC_SITE_URL should match the host you attach.
app = "gitsift"
primary_region = "ams"
kill_signal = "SIGINT"
kill_timeout = "5s"

[build]
  dockerfile = "Dockerfile"

  [build.args]
    NEXT_PUBLIC_SITE_URL = "https://gitsift.dev"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  DATABASE_PATH = "/data/gitsift.db"
  NEXT_PUBLIC_SITE_URL = "https://gitsift.dev"

[mounts]
  source = "gitsift_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
