name: Refresh the index

on:
  schedule:
    # 06:17 UTC daily. Off the hour to avoid GitHub's busiest cron minute.
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      max_queries:
        description: "Limit GitHub search queries (blank = all sixteen)"
        required: false
        default: ""

concurrency:
  group: ingest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check configuration
        env:
          GITSIFT_URL: ${{ vars.GITSIFT_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$GITSIFT_URL" ]; then
            echo "::error::Repository variable GITSIFT_URL is not set (for example http://localhost:3000)."
            exit 1
          fi
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Repository secret CRON_SECRET is not set."
            exit 1
          fi

      - name: Trigger ingestion
        env:
          GITSIFT_URL: ${{ vars.GITSIFT_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          MAX_QUERIES: ${{ inputs.max_queries }}
        run: |
          URL="${GITSIFT_URL%/}/api/cron/ingest"
          if [ -n "$MAX_QUERIES" ]; then
            URL="$URL?maxQueries=$MAX_QUERIES"
          fi
          echo "POST $URL"
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-delay 30 --max-time 600 \
            -X POST "$URL" \
            -H "Authorization: Bearer $CRON_SECRET"
